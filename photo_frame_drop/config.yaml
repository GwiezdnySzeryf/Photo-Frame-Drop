name: "Photo Frame Drop"
description: "Aplikacja WWW do przesyłania i zarządzania zdjęciami na cyfrowej ramce."
version: "1.0.1"
slug: "photo_frame_drop"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map:
  - media:rw
options:
  access_key: ""
  upload_folder: "digital_frame"
  notify_on_upload: true
schema:
  access_key: password
  upload_folder: match(^[\w\-\.]+$)
  notify_on_upload: bool
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Interfejs WWW (dostępny z zewnątrz po wystawieniu portu)"
ingress: true
ingress_port: 8000
panel_icon: mdi:image-multiple
panel_title: "Cyfrowa Ramka"
