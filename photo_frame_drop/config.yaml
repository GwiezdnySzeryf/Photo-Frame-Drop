name: "Photo Frame Drop"
version: "2.0.2"
slug: photo_frame_drop
description: "Drag & drop photos into your HA /media folder from anywhere, with a gallery and password protection."
url: "https://github.com/GwiezdnySzeryf/Photo-Frame-Drop"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

init: false
hassio_api: true
homeassistant_api: false

map:
  - type: media
    read_only: false

ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
panel_title: Photo Frame Drop

ports:
  8099/tcp: null

options:
  target_folder: "digital_frame"
  password: "changeme"
  max_upload_mb: 50
  allowed_extensions: "jpg,jpeg,png,gif,webp,bmp"
  notify_on_upload: false
  notify_message: "New photo added to the frame!"

schema:
  target_folder: str
  password: str
  max_upload_mb: "int(1,500)"
  allowed_extensions: str
  notify_on_upload: bool
  notify_message: str

watchdog: "http://[HOST]:[PORT:8099]/health"
timeout: 10
